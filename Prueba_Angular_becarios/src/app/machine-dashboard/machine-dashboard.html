<div class="dashboard-layout">

  <header class="dashboard-header">
    <h1>Panel de Control de la Máquina</h1>
    <hr>
  </header>

  <div class="dashboard-content">
    <app-telemetry-display [machineState]="machineState$ | async"></app-telemetry-display>

    <app-control-panel
      (start)="startMachine()"
      (stop)="stopMachine()">
    </app-control-panel>
  </div>
</div>
