<div class="dashboard-layout">
  <header class="dashboard-header">
    <h2>Panel de Control de la Máquina</h2>
  </header>

  <div class="dashboard-content">
    <!-- Componente de visualización -->
    <app-telemetry-display [machineState]="machineState$ | async"></app-telemetry-display>

    <!-- Requisito: Componente hijo de control -->
    <!-- Escuchamos los eventos (startAction) y (stopAction) y ejecutamos los métodos del padre -->
    <app-control-panel
      (startAction)="startMachine()"
      (stopAction)="stopMachine()">
    </app-control-panel>
  </div>
</div>
